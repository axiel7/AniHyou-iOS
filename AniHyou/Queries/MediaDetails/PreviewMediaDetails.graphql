query PreviewMediaDetails($mediaId: Int) {
  Media(id: $mediaId) {
    title {
      userPreferred
    }
    coverImage {
      large
    }
    weightedScore
    format
    episodes
    chapters
    volumes
    genres
    nextAiringEpisode {
      airingAt
      episode
    }
    mediaListEntry {
      status
      progress
    }
  }
}
