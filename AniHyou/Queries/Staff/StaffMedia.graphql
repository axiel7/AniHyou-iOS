query StaffMedia($staffId: Int, $onList: Boolean, $mediaType: MediaType, $page: Int, $perPage: Int) {
    Staff(id: $staffId) {
        staffMedia(page: $page, perPage: $perPage, sort: [START_DATE_DESC], onList: $onList, type: $mediaType) {
            edges {
                id
                node {
                    id
                    title {
                        userPreferred
                    }
                    type
                    coverImage {
                        large
                    }
                    mediaListEntry {
                        status
                    }
                    startDate {
                        ...FuzzyDateFragment
                    }
                    isAdult
                }
                staffRole
            }
            pageInfo {
                ...CommonPage
            }
        }
    }
}
