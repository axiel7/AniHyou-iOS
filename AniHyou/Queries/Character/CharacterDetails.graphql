query CharacterDetails($characterId: Int) {
  Character(id: $characterId) {
    id
    name {
      userPreferred
      native
      alternative
      alternativeSpoiler
    }
    image {
      large
    }
    description(asHtml: true)
    gender
    dateOfBirth {
      ...FuzzyDateFragment
    }
    height {
      ...HeightFragment
    }
    age
    bloodType
    ...IsFavouriteCharacter
    favourites
  }
}

fragment IsFavouriteCharacter on Character
@apollo_client_ios_localCacheMutation {
  id
  isFavourite
}
